name: Feature request
description: Propose a change in behavior before writing code
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Let It Brew deliberately has no power modes, idle-grace timers, or activity tuning — that restraint is part of the product. Proposals that add a setting need a strong reason why the behavior can't be automatic instead.

        Open this before writing a feature PR, so we can agree on scope first.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you hitting?
      description: Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: What does Let It Brew do today?
      description: Including anything you tried in Settings.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What behavior would you expect instead?
    validations:
      required: true

  - type: dropdown
    id: setting
    attributes:
      label: Would this need a new user-facing setting?
      options:
        - "No — it should be automatic"
        - "Yes"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: Any effect on sleep, power, or the background service?
      description: Leave blank if none.
